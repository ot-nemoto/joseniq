<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>JOSENIQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho+B1:wght@500;700;800&display=swap"
    />
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div class="brand">
          <h1>JOSENIQ</h1>
        </div>
        <div class="tabs" role="tablist" aria-label="モード">
          <button type="button" role="tab" id="tabEdit" aria-selected="true">防衛</button>
          <button type="button" role="tab" id="tabBattle" aria-selected="false">攻城</button>
          <button type="button" role="tab" id="tabUnits" aria-selected="false">兵種</button>
        </div>
      </header>

      <div class="layout" id="layoutMain">
        <section class="board" aria-label="戦場">
          <div class="canvasWrap" id="wrap">
            <canvas id="cv" tabindex="0" aria-label="戦場マップ" aria-describedby="hint"></canvas>
            <div class="overlay" id="overlay" hidden>
              <div class="result">
                <h2 id="resTitle">落城</h2>
                <p id="resSub"></p>
                <p id="resA"></p>
                <p id="resB"></p>
                <div class="row">
                  <button type="button" class="btn primary" id="resRetry">もう一度攻める</button>
                  <button type="button" class="btn" id="resEdit">配置を直す</button>
                </div>
              </div>
            </div>
            <div class="toast" id="toast" hidden></div>
            <!-- 口にマウスを合わせると出る、出撃の予定（武将と開始秒） -->
            <div class="gatePop" id="gatePop" hidden></div>
            <!-- 何も選んでいないときに、マウスを合わせた施設や武将の情報を出す -->
            <div class="gatePop infoPop" id="infoPop" hidden></div>
          </div>
          <div class="boardBar">
            <fieldset class="viewBtns" aria-label="盤面の向き">
              <button type="button" class="btn" id="viewReset">向きを戻す</button>
            </fieldset>
            <!-- 防衛配置の編成例（スクロールしなくても届くよう、盤面のすぐ下に置く。防衛配置のときだけ出す） -->
            <fieldset class="viewBtns" id="presetBar" aria-label="編成例">
              <button type="button" class="btn" data-preset="flat">基本（平城）</button>
              <button type="button" class="btn" data-preset="hirayama">基本（平山城）</button>
              <button type="button" class="btn" data-preset="yama">基本（山城）</button>
              <button type="button" class="btn" id="clearBtn">全消去</button>
            </fieldset>
          </div>
          <p class="hint" id="hint"></p>
          <p class="sr" id="kbdStatus" aria-live="polite"></p>
        </section>

        <aside class="side">
          <div id="panelEdit">
            <h2>防衛配置</h2>
            <!-- 攻城を始められない理由（門の数・本丸への道） -->
            <p class="warn" id="editReady" hidden></p>
            <h3 class="cat first">地形</h3>
            <fieldset class="seg" id="mapSeg" aria-label="地形"></fieldset>
            <h3 class="cat">施設</h3>
            <div class="toolgrid" id="toolgrid"></div>
            <h3 class="cat">武将<span id="genEditCount"></span></h3>
            <div class="toolgrid" id="genEditGrid"></div>
            <details>
              <summary>配置データ（JSON）</summary>
              <textarea id="json" spellcheck="false" aria-label="配置データ"></textarea>
              <div class="row2">
                <button type="button" class="btn" id="jsonOut">書き出し</button>
                <button type="button" class="btn" id="jsonIn">読み込み</button>
              </div>
            </details>
          </div>

          <div id="panelBattle" hidden>
            <h2>攻城配置</h2>
            <h3 class="cat first">兵<span id="siegeCost"></span></h3>
            <div class="toolgrid" id="unitgrid"></div>
            <h3 class="cat">武将<span id="genUnitCount"></span></h3>
            <div class="toolgrid" id="genUnitGrid"></div>
            <h3>編成例</h3>
            <div class="row2">
              <button type="button" class="btn" id="siegeBasic">基本</button>
              <button type="button" class="btn" id="siegeClear">全消去</button>
            </div>
            <details>
              <summary>出撃記録（JSON）</summary>
              <textarea id="recJson" spellcheck="false" aria-label="出撃記録"></textarea>
              <div class="row2">
                <button type="button" class="btn" id="recOut">書き出し</button>
                <button type="button" class="btn" id="recIn">読み込み</button>
              </div>
              <p class="note">口と、口ごとの出撃の予定を記録します。戦ったあとに書き出すと、手動で出した兵や武将も予定にまとめます。読み込むと、攻城配置として盤面に置きます。</p>
            </details>

            <h2 class="sub">戦闘</h2>
            <div class="meter">
              <div class="row clock"><span>経過</span><b id="timeText">0:00 / 2:30</b></div>
              <div class="row"><span>残り兵力</span><b id="budLeft">60 / 60</b></div>
              <div class="bar a"><i id="budBar"></i></div>
            </div>
            <div class="row2">
              <button type="button" class="btn primary" id="startBtn">開戦</button>
              <button type="button" class="btn" id="pauseBtn">一時停止</button>
              <fieldset class="seg" id="speedSeg" aria-label="速度">
                <button type="button" data-s="1" aria-pressed="true">1×</button>
                <button type="button" data-s="2" aria-pressed="false">2×</button>
                <button type="button" data-s="4" aria-pressed="false">4×</button>
              </fieldset>
            </div>
            <p class="warn" id="battleReady" hidden></p>
            <div class="row2">
              <button type="button" class="btn" id="retryBtn">最初からやり直す</button>
            </div>
            <h3>戦況</h3>
            <ol class="log" id="log"></ol>
          </div>
        </aside>
      </div>

      <section class="units" id="unitsView" hidden aria-label="攻城兵の比較">
        <div class="uhead">
          <div>
            <h2 id="cmpTitle">攻城兵の比較</h2>
            <p id="cmpDesc">数値は戦闘計算でそのまま使っている値です（武将は「武将」で比べられます）。</p>
          </div>
          <div class="uctl">
            <fieldset class="seg" id="cmpSide" aria-label="比較する側">
              <button type="button" data-s="atk" aria-pressed="true">攻城兵</button>
              <button type="button" data-s="def" aria-pressed="false">防御施設</button>
              <button type="button" data-s="gen" aria-pressed="false">武将</button>
            </fieldset>
          </div>
        </div>
        <div id="atkCmp">
          <details class="rankFold">
            <summary>番付</summary>
            <div class="bars" id="bars"></div>
          </details>
          <div class="tableWrap"><table id="unitTable"></table></div>
        </div>
        <div id="defCmp" hidden>
          <details class="rankFold">
            <summary>番付</summary>
            <div class="bars" id="defBars"></div>
          </details>
          <div class="tableWrap"><table id="defTable"></table></div>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
