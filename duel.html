<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JOSENIQ 1対1の戦いの確かめ</title>
    <!-- 開発する人のためのページ。ゲームの画面からはリンクしない（docs/development.md の「1対1の戦いの確かめ」） -->
    <style>
      /* 配置：上に操作の帯、左に盤面と結果、右に体力の図と傷の一覧 */
      body.duelPage {
        margin: 0;
        padding: 12px 16px 24px;
        background: var(--bg);
        color: var(--ink);
      }
      .duelPage h1 { margin: 0 0 10px; font-size: 18px; }
      .duelBar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 10px; }
      .duelBar label { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; }
      .duelBar select, .duelBar input[type="number"], .duelBar button { font: inherit; font-size: 13px; padding: 4px 8px; color: var(--ink); background: var(--surface); border: 1px solid var(--muted); border-radius: 6px; }
      .duelBar button { cursor: pointer; }
      .duelBar button:disabled { opacity: 0.45; cursor: default; }
      .duelBar button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
      .duelBar input[type="number"] { width: 4.6em; }
      .speeds { display: inline-flex; gap: 2px; margin: 0; padding: 0; border: 0; }
      .cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 14px; align-items: start; }
      @media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } }
      .duelBoard { position: relative; border-radius: 8px; overflow: hidden; background: var(--surface); }
      .duelCard { background: var(--surface); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
      .cols > div > .duelCard:first-child { margin-top: 0; }
      .duelCard h2 { margin: 0 0 6px; font-size: 13px; }
      #result { font-size: 15px; font-weight: 700; }
      #clock { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
      th, td { padding: 3px 6px; text-align: right; border-bottom: 1px solid color-mix(in srgb, var(--muted) 30%, transparent); }
      th:first-child, td:first-child { text-align: left; }
      th { color: var(--muted); font-weight: 400; }
      .duelPage .key { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }
      .duelPage .key.left { background: var(--atk); }
      .duelPage .key.right { background: var(--def); }
      #hits { max-height: 300px; overflow: auto; }
      #hits thead th { position: sticky; top: 0; background: var(--surface); }
      .legend { display: flex; gap: 14px; font-size: 13px; margin-bottom: 4px; }
      .chartBox { position: relative; }
      #chart { display: block; width: 100%; height: 260px; }
      #chart text { fill: var(--muted); font-size: 11px; }
      #chart .name { fill: var(--ink); font-size: 12px; }
      #chart .grid { stroke: color-mix(in srgb, var(--muted) 25%, transparent); stroke-width: 1; }
      #chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; }
      #chart .line.left { stroke: var(--atk); }
      #chart .line.right { stroke: var(--def); }
      #chart .cross { stroke: var(--muted); stroke-width: 1; }
      #tip { position: absolute; top: 6px; padding: 5px 8px; font-size: 12px; line-height: 1.5; white-space: nowrap; pointer-events: none; color: var(--ink); background: var(--bg); border: 1px solid var(--muted); border-radius: 6px; font-variant-numeric: tabular-nums; }
    </style>
  </head>
  <body class="duelPage">
    <h1>1対1の戦いの確かめ</h1>
    <div class="duelBar">
      <label>攻め <select id="left"></select></label>
      <button type="button" id="swap" title="攻めと守りを入れ替える（武将どうしのとき）">左右を入れ替える</button>
      <label>守り <select id="right"></select></label>
      <label>距離 <input type="number" id="dist" step="1" /> マス</label>
      <button type="button" id="play">開始</button>
      <button type="button" id="tick" title="1コマ（1/30秒）進める">1コマ</button>
      <button type="button" id="finish">決着まで</button>
      <button type="button" id="reset">やり直し</button>
      <fieldset class="speeds" id="speeds" aria-label="速さ"></fieldset>
      <span id="clock"></span>
    </div>
    <div class="cols">
      <div>
        <div class="canvasWrap duelBoard"><canvas id="duelCv" tabindex="0" aria-label="戦いの盤面"></canvas></div>
        <div class="duelCard">
          <div id="result" role="status"></div>
          <table id="totals"></table>
        </div>
      </div>
      <div>
        <div class="duelCard">
          <h2>体力（はじめの体力を100%として）</h2>
          <div class="legend" id="legend"></div>
          <div class="chartBox">
            <svg id="chart" role="img" aria-label="時間と体力の折れ線。数値は下の傷の一覧にある"></svg>
            <div id="tip" hidden></div>
          </div>
        </div>
        <div class="duelCard">
          <h2>傷の一覧</h2>
          <div id="hits"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/duel.ts"></script>
  </body>
</html>
