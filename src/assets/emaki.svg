<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2400 220" preserveAspectRatio="xMidYMid slice">
  <title>戦国絵巻風の背景</title>
  <!-- ヘッダーの背景：戦国絵巻風の横長の絵。和紙の地に遠山・川・天守・松・幟の列、上下に金雲（すやり霞）。
       左半分は右半分の景色を左右反転して使う。CSS で高さに合わせて右寄せで敷く -->
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2e7ca" />
      <stop offset="1" stop-color="#e4d3a8" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3d986" />
      <stop offset="0.55" stop-color="#d9b24e" />
      <stop offset="1" stop-color="#b88d2c" />
    </linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d7d89" />
      <stop offset="1" stop-color="#3f4b55" />
    </linearGradient>
    <filter id="fiber" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85 0.04" numOctaves="2" seed="7" />
      <feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.18  0 0 0 0.16 0" />
    </filter>
    <!-- 金雲の1本：両端が丸く、ところどころ段のついた横長の帯 -->
    <g id="cloud">
      <rect x="0" y="10" width="300" height="26" rx="13" />
      <rect x="40" y="0" width="150" height="24" rx="12" />
      <rect x="170" y="22" width="190" height="24" rx="12" />
    </g>
    <!-- 松 -->
    <g id="pine">
      <path d="M0 60 C 4 40, -6 26, 4 6" stroke="#5b4630" stroke-width="5" fill="none" stroke-linecap="round" />
      <ellipse cx="-10" cy="16" rx="26" ry="7" fill="#3f5e3c" />
      <ellipse cx="14" cy="4" rx="22" ry="6" fill="#4b6d45" />
      <ellipse cx="4" cy="30" rx="30" ry="7" fill="#365334" />
    </g>
    <!-- 幟：竿と旗 -->
    <g id="nobori">
      <line x1="0" y1="0" x2="0" y2="46" stroke="#4a3a28" stroke-width="2" />
      <rect x="1" y="3" width="9" height="28" />
    </g>

    <!-- 幅1200の景色の層。右半分と、左右反転した左半分に使う -->
    <g id="land">
      <path d="M0 140 C 70 108, 130 118, 200 98 S 330 66, 420 100 S 560 76, 650 92 S 820 52, 905 84 S 1080 62, 1200 88 L1200 220 L0 220 Z" fill="#a3b096" opacity="0.5" />
      <path d="M0 170 C 120 140, 240 150, 360 136 S 560 128, 700 140 S 860 104, 960 112 S 1120 126, 1200 120 L1200 220 L0 220 Z" fill="#84987b" opacity="0.65" />
      <path d="M0 196 C 180 182, 380 204, 600 190 S 1000 176, 1200 194 L1200 220 L0 220 Z" fill="#7ea4b3" opacity="0.6" />
      <path d="M60 204 C 200 198, 320 208, 470 202 M700 198 C 820 192, 950 202, 1100 196" stroke="#f5efe0" stroke-width="1.5" fill="none" opacity="0.7" />
    </g>
    <g id="front">
      <use href="#pine" transform="translate(420 118) scale(0.9)" />
      <use href="#pine" transform="translate(880 120) scale(0.85)" />
      <use href="#pine" transform="translate(1080 112) scale(1.05)" />
      <use href="#pine" transform="translate(1160 130) scale(0.75)" />
      <g transform="translate(150 112)">
        <use href="#nobori" x="0" y="8" fill="#b2402b" />
        <use href="#nobori" x="18" y="4" fill="#2c3e6b" />
        <use href="#nobori" x="36" y="10" fill="#b2402b" />
        <use href="#nobori" x="54" y="2" fill="#d9b24e" />
        <use href="#nobori" x="72" y="9" fill="#2c3e6b" />
        <use href="#nobori" x="90" y="5" fill="#b2402b" />
      </g>
      <g transform="translate(640 124) scale(0.8)">
        <use href="#nobori" x="0" y="6" fill="#2c3e6b" />
        <use href="#nobori" x="18" y="0" fill="#b2402b" />
        <use href="#nobori" x="36" y="8" fill="#2c3e6b" />
      </g>
    </g>
    <g id="clouds" fill="url(#gold)" stroke="#a07a24" stroke-width="1.5">
      <use href="#cloud" transform="translate(-60 -8) scale(1.6 1)" />
      <use href="#cloud" transform="translate(760 -14) scale(1.5 1)" />
      <use href="#cloud" transform="translate(300 160) scale(1.1 0.9)" />
      <use href="#cloud" transform="translate(860 176) scale(1.3 0.9)" />
    </g>
  </defs>

  <rect width="2400" height="220" fill="url(#paper)" />
  <rect width="2400" height="220" filter="url(#fiber)" />

  <!-- 地形：右半分はそのまま、左半分は左右反転（つなぎ目の高さがそろう） -->
  <use href="#land" transform="translate(1200 0)" />
  <use href="#land" transform="translate(1200 0) scale(-1 1)" />

  <!-- 丘の上の天守。ヘッダー右端のタブに隠れない位置に置く -->
  <g transform="translate(1750 56) scale(0.9)">
    <path d="M-62 92 L62 92 C 52 82, 48 74, 46 66 L-46 66 C -48 74, -52 82, -62 92 Z" fill="#8e938d" stroke="#5f655f" stroke-width="1.5" />
    <path d="M-58 84 H58 M-54 76 H54" stroke="#5f655f" stroke-width="1" />
    <rect x="-40" y="44" width="80" height="22" fill="#f5f1e6" stroke="#323b43" stroke-width="1" />
    <rect x="-40" y="58" width="80" height="8" fill="#34302c" />
    <g fill="#34302c">
      <rect x="-30" y="48" width="7" height="8" /><rect x="-12" y="48" width="7" height="8" />
      <rect x="6" y="48" width="7" height="8" /><rect x="24" y="48" width="7" height="8" />
    </g>
    <path d="M-56 46 Q 0 38 56 46 L 34 34 L -34 34 Z" fill="url(#roof)" stroke="#262d33" stroke-width="1" />
    <rect x="-28" y="16" width="56" height="18" fill="#f5f1e6" stroke="#323b43" stroke-width="1" />
    <g fill="#34302c"><rect x="-18" y="21" width="6" height="7" /><rect x="-3" y="21" width="6" height="7" /><rect x="12" y="21" width="6" height="7" /></g>
    <path d="M-12 36 L12 36 L0 24 Z" fill="#f5f1e6" stroke="#262d33" stroke-width="1.5" />
    <path d="M-42 18 Q 0 11 42 18 L 22 6 L -22 6 Z" fill="url(#roof)" stroke="#262d33" stroke-width="1" />
    <rect x="-17" y="-8" width="34" height="14" fill="#f5f1e6" stroke="#323b43" stroke-width="1" />
    <g fill="#34302c"><rect x="-10" y="-4" width="5" height="6" /><rect x="5" y="-4" width="5" height="6" /></g>
    <path d="M-30 -6 Q 0 -12 30 -6 L 8 -22 L -8 -22 Z" fill="url(#roof)" stroke="#262d33" stroke-width="1" />
    <path d="M-9 -22 q -3 -8 -6 -11 q 4 2 8 9 Z M9 -22 q 3 -8 6 -11 q -4 2 -8 9 Z" fill="#d9b24e" />
  </g>

  <use href="#front" transform="translate(1200 0)" />
  <use href="#front" transform="translate(1200 0) scale(-1 1)" />
  <use href="#clouds" transform="translate(1200 0)" />
  <use href="#clouds" transform="translate(1200 0) scale(-1 1)" />
</svg>
