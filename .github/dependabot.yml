version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development

  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
    target-branch: develop

  # dev-commons の配布を受けないので、ワークフローの actions の版もここで上げる
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: develop
    groups:
      github-actions:
        patterns:
          - "*"
